name: deploy ui only
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth 1 -b gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" out
          cp hood.html out/index.html
          for f in logo.svg favicon.png; do [ -f "$f" ] && cp "$f" out/; done
          cd out
          git config user.name "hood-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -qm "ui $(date -u '+%H:%M UTC')" || exit 0
          git push -q origin gh-pages
