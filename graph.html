<!DOCTYPE html><html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
html,body{margin:0;height:100%;background:#07090b;color:#dfe7ea;
  font-family:ui-monospace,'SF Mono',Menlo,monospace;overflow:hidden}
#c{width:100vw;height:100vh;display:block}
#hd{position:fixed;top:18px;left:20px;z-index:5;pointer-events:none}
#hd h1{margin:0;font-size:19px;letter-spacing:-.4px;color:#39d98a;font-weight:700}
#hd p{margin:5px 0 0;font-size:11px;color:#5e7078;line-height:1.7}
#tip{position:fixed;display:none;background:#0d1114;border:1px solid #1e2a30;
  border-radius:5px;padding:9px 11px;font-size:11px;line-height:1.65;
  pointer-events:none;z-index:10;max-width:250px}
#tip b{color:#39d98a}
#lg{position:fixed;bottom:16px;left:20px;font-size:10px;color:#4b5c64;
  line-height:1.8;z-index:5;pointer-events:none}
#sr{position:fixed;top:18px;right:20px;z-index:6}
#sr input{background:#0d1114;border:1px solid #1e2a30;color:#dfe7ea;
  padding:7px 11px;border-radius:4px;font-family:inherit;font-size:11px;width:190px;outline:none}
#sr input:focus{border-color:#39d98a}
</style></head><body>
<canvas id="c"></canvas>
<div id="hd"><h1>onchainhoodies · holder affinity</h1>
<p id="sub">loading…</p></div>
<div id="sr"><input id="q" placeholder="search address or ens…"></div>
<div id="lg">node size = hoodies held &nbsp;·&nbsp; link = shared rare collections<br>
drag to pan &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; hover a node</div>
<div id="tip"></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=innerWidth,Hh=innerHeight,DPR=devicePixelRatio||1;
function size(){W=innerWidth;Hh=innerHeight;cv.width=W*DPR;cv.height=Hh*DPR;
cv.style.width=W+'px';cv.style.height=Hh+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
size();addEventListener('resize',()=>{size();draw();});

fetch('graph.json').then(r=>r.json()).then(G=>{
const nodes=G.nodes.filter(n=>n.deg>0).map(n=>Object.assign({},n));
const keep=new Set(nodes.map(n=>n.i));
const remap=new Map(nodes.map((n,k)=>[n.i,k]));
const links=G.edges.filter(e=>keep.has(e.s)&&keep.has(e.t))
  .map(e=>({source:remap.get(e.s),target:remap.get(e.t),w:e.w,n:e.n}));

document.getElementById('sub').innerHTML=
  nodes.length+' entities &nbsp;·&nbsp; '+links.length+' affinity links &nbsp;·&nbsp; '+
  G.nodes.reduce((s,n)=>s+n.hoodies,0)+' hoodies';

const tribes=[...new Set(nodes.map(n=>n.tribe).filter(Boolean))];
const pal=d3.scaleOrdinal(d3.quantize(d3.interpolateRainbow,Math.max(3,Math.min(tribes.length,24))));
const col=n=>n.tribe?pal(tribes.indexOf(n.tribe)%24):'#33454d';
const rad=n=>2.2+Math.sqrt(n.hoodies||1)*1.9;

const sim=d3.forceSimulation(nodes)
 .force('link',d3.forceLink(links).distance(d=>34*(1-d.w)+9).strength(d=>Math.min(d.w*1.6,.85)))
 .force('charge',d3.forceManyBody().strength(-26).distanceMax(340))
 .force('center',d3.forceCenter(W/2,Hh/2))
 .force('collide',d3.forceCollide(d=>rad(d)+1.6))
 .alphaDecay(0.016);

let tf=d3.zoomIdentity,hov=null,hi=null;
d3.select(cv).call(d3.zoom().scaleExtent([.15,7]).on('zoom',e=>{tf=e.transform;draw();}));

function draw(){
 ctx.save();ctx.clearRect(0,0,W,Hh);
 ctx.translate(tf.x,tf.y);ctx.scale(tf.k,tf.k);
 ctx.lineWidth=.45/tf.k;
 for(const l of links){
  const on=hi&&(l.source===hi||l.target===hi);
  ctx.strokeStyle=on?'rgba(57,217,138,.75)':'rgba(120,160,175,'+(0.05+l.w*0.4)+')';
  ctx.lineWidth=(on?1.4:0.45)/tf.k;
  ctx.beginPath();ctx.moveTo(l.source.x,l.source.y);ctx.lineTo(l.target.x,l.target.y);ctx.stroke();
 }
 for(const n of nodes){
  const on=hi===n;
  ctx.beginPath();ctx.arc(n.x,n.y,rad(n),0,6.284);
  ctx.fillStyle=on?'#39d98a':col(n);ctx.fill();
  if(n.wallets>1){ctx.strokeStyle='#ff6b6b';ctx.lineWidth=1.3/tf.k;ctx.stroke();}
  if(on||(tf.k>2.4&&n.hoodies>3)){
   ctx.fillStyle='#c7d6dc';ctx.font=(9/tf.k)+'px ui-monospace,monospace';
   ctx.fillText((n.ens||n.a.slice(0,8)),n.x+rad(n)+2.5/tf.k,n.y+3/tf.k);
  }
 }
 ctx.restore();
}
sim.on('tick',draw);

const tip=document.getElementById('tip');
cv.addEventListener('mousemove',ev=>{
 const x=(ev.offsetX-tf.x)/tf.k,y=(ev.offsetY-tf.y)/tf.k;
 let best=null,bd=1e9;
 for(const n of nodes){const dx=n.x-x,dy=n.y-y,d=dx*dx+dy*dy;
  if(d<bd&&d<Math.pow(rad(n)+5,2)){bd=d;best=n;}}
 hi=best;
 if(best){
  tip.style.display='block';tip.style.left=(ev.clientX+13)+'px';tip.style.top=(ev.clientY+13)+'px';
  tip.innerHTML='<b>'+(best.ens||best.a.slice(0,16)+'…')+'</b><br>'+
   best.hoodies+' hoodies · '+best.cols+' collections<br>'+
   best.deg+' connections'+
   (best.tribe?'<br>tribe: <b>'+best.tribe+'</b>':'')+
   (best.wallets>1?'<br><span style="color:#ff6b6b">'+best.wallets+' linked wallets</span>':'');
 } else tip.style.display='none';
 draw();
});

document.getElementById('q').addEventListener('input',e=>{
 const q=e.target.value.toLowerCase().trim();
 if(!q){hi=null;draw();return;}
 hi=nodes.find(n=>(n.ens&&n.ens.toLowerCase().includes(q))||n.a.toLowerCase().includes(q))||null;
 if(hi){tf=d3.zoomIdentity.translate(W/2-hi.x*2.2,Hh/2-hi.y*2.2).scale(2.2);}
 draw();
});
});
</script></body></html>
